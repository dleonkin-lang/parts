<body class="choosing overlay-collapsed">
<main>
  <div class="top">
    <h1>Разрезания клетчатых фигур</h1>
    <div id="status" class="status"><i class="dot"></i><span>Загрузка</span></div>
  </div>
  <section class="layout">
    <aside id="catalogPanel" class="panel">
      <div class="head"><b>Каталог</b><span id="total" class="muted"></span></div>
      <div class="body catalog">
        <input id="search" class="field" placeholder="Поиск по задачам">
        <select id="partsFilter" class="field">
          <option value="all">Любое число частей</option>
          <option value="2">2 части</option>
          <option value="3">3 части</option>
          <option value="4">4 части</option>
        </select>
        <div id="folders" class="folders"></div>
      </div>
    </aside>
    <section>
      <div id="cardsPanel" class="panel cards-panel">
        <div class="head">
          <b>Задачи</b>
          <div class="row"><span id="shown" class="muted"></span><button id="confirmTask" class="primary" type="button">Подтвердить</button></div>
        </div>
        <div class="body">
          <div id="cards" class="cards"></div>
        </div>
      </div>
      <div id="workPanel" class="panel" style="margin-top:14px">
        <div class="head">
          <div id="taskInfo" class="task"></div>
          <div class="row"><button id="changeTask" type="button">Другая задача</button><button id="toggleOverlay" type="button"></button><button id="resetTask">Начать заново</button></div>
        </div>
        <div id="externalNotice" class="body empty"></div>
        <div id="splitTools" class="body split-tools">
          <b>Место на экране</b>
          <button id="lessCut" type="button">Разрез меньше</button><input id="splitRange" type="range" min="35" max="70" value="45" aria-label="Место для разреза"><button id="moreCut" type="button">Разрез больше</button>
          <span id="splitLabel" class="muted"></span>
        </div>
        <div id="workspace" class="body workspace">
          <section id="cutPane">
            <div class="modes"><button id="mShape" class="on">Фигура</button><button id="mCut">Разрез</button></div>
            <div id="grid" class="grid"></div>
            <div id="pieces" class="pieces"></div>
            <div class="row" style="margin-top:10px"><button id="add">Добавить часть</button><button id="rem">Убрать часть</button><button id="clear">Очистить</button></div>
            <div id="checks" class="checks"></div>
          </section>
          <section id="overlayPane">
            <div class="bar">
              <span id="chosen" class="muted"></span>
              <div class="row move"><button id="left">←</button><button id="up">↑</button><button id="down">↓</button><button id="right">→</button><button id="rot">⟳</button><button id="flip">⇋</button></div>
            </div>
            <div class="row" style="margin:10px 0"><button id="arrange">Разложить</button><button id="snap" class="primary">Наложить</button></div>
            <div id="board" class="board"></div>
          </section>
        </div>
      </div>
    </section>
  </section>
</main>
<script>
const R=10,C=12,BR=14,BC=18,colors=["#2563eb","#f97316","#16a34a","#dc2626","#7c3aed","#0891b2","#ca8a04","#be185d"];
let data={folders:[],tasks:[]},activeFolder="all",activeTask=null,choosing=true,overlayOpen=false,split=45,offset={r:0,c:0},markByDisplay=new Map();
let st={mode:"shape",shape:new Set,asg:new Map,p:[],sel:0,reveal:false,drag:null};
const $=id=>document.getElementById(id),key=(r,c)=>r+","+c,xy=k=>k.split(",").map(Number),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
async function init(){try{let v=new URLSearchParams(location.search).get("v")||Date.now();data=await fetch("data/tasks.json?v="+encodeURIComponent(v),{cache:"no-store"}).then(r=>r.json())}catch(e){$("cards").innerHTML='<div class="empty">Не удалось загрузить data/tasks.json</div>';return}renderCatalog();loadTask(data.tasks[0].id);setStage()}
function ensure(n){while(st.p.length<n){let i=st.p.length;st.p.push({name:"Часть "+(i+1),col:colors[i%colors.length],x:1,y:1,rot:0,flip:false})}while(st.p.length>n){let i=st.p.length-1;st.p.pop();[...st.asg].forEach(([k,v])=>{if(v==i)st.asg.delete(k)})}st.sel=Math.min(Math.max(st.sel,0),st.p.length-1)}
function cells(i){let a=[];for(let k of st.shape)if(st.asg.get(k)===i){let [r,c]=xy(k);a.push({r,c})}return a}
function norm(a){if(!a.length)return[];let mr=Math.min(...a.map(v=>v.r)),mc=Math.min(...a.map(v=>v.c));return a.map(v=>({r:v.r-mr,c:v.c-mc})).sort((a,b)=>a.r-b.r||a.c-b.c)}
function rot(v,n){let r=v.r,c=v.c;while(n--)[r,c]=[c,-r];return{r,c}}
function trans(a,r,f){return norm(norm(a).map(v=>rot(f?{r:v.r,c:-v.c}:v,r)))}
function sig(a){return norm(a).map(v=>v.r+":"+v.c).join("|")}
function canon(a){let s=[];for(let f of[0,1])for(let r=0;r<4;r++)s.push(sig(trans(a,r,f)));return s.sort()[0]||""}
function dim(a){a=norm(a);return a.length?{h:Math.max(...a.map(v=>v.r))+1,w:Math.max(...a.map(v=>v.c))+1}:{h:0,w:0}}
function bCells(i){let p=st.p[i];return trans(cells(i),p.rot,p.flip).map(v=>({r:v.r+p.y,c:v.c+p.x}))}
function okPlace(a,x,y,occ){return a.every(v=>v.r+y>=0&&v.c+x>=0&&v.r+y<BR&&v.c+x<BC&&!occ.has((v.r+y)+":"+(v.c+x)))}
function occupy(a,x,y,occ){a.forEach(v=>occ.add((v.r+y)+":"+(v.c+x)))}
function place(a,occ){let d=dim(a),mx=Math.max(0,BC-d.w),my=Math.max(0,BR-d.h);for(let i=0;i<160;i++){let x=rnd(0,mx),y=rnd(0,my);if(okPlace(a,x,y,occ))return{x,y}}for(let y=0;y<=my;y++)for(let x=0;x<=mx;x++)if(okPlace(a,x,y,occ))return{x,y};return{x:rnd(0,mx),y:rnd(0,my)}}
function connected(a){if(!a.length)return false;let s=new Set(a.map(v=>key(v.r,v.c))),q=[a[0]],seen=new Set([key(a[0].r,a[0].c)]);for(let i=0;i<q.length;i++)for(let[dR,dC]of[[1,0],[-1,0],[0,1],[0,-1]]){let n=key(q[i].r+dR,q[i].c+dC);if(s.has(n)&&!seen.has(n)){seen.add(n);q.push({r:q[i].r+dR,c:q[i].c+dC})}}return seen.size==s.size}
function originalToDisplay(cell){return key(cell[0]+offset.r,cell[1]+offset.c)}
function partOfOriginal(cell){return st.asg.get(originalToDisplay(cell))}
function constraintStatus(c){let parts=(c.cells||[]).map(partOfOriginal);if(parts.some(v=>v===undefined))return false;if(c.type==="same-piece")return parts.every(v=>v===parts[0]);if(c.type==="different-pieces")return new Set(parts).size===parts.length;return true}
function constraintsOk(){return (activeTask?.constraints||[]).every(constraintStatus)}
function solve(){let total=st.shape.size,filled=[...st.shape].filter(k=>st.asg.has(k)).length,arr=st.p.map((_,i)=>cells(i)),non=arr.every(a=>a.length),conn=non&&arr.every(connected),can=arr.map(canon),eq=non&&can.every(x=>x==can[0]),bs=st.p.map((_,i)=>bCells(i).map(v=>v.r+":"+v.c).sort().join("|")),over=non&&bs.every(x=>x==bs[0]),inside=st.p.every((_,i)=>bCells(i).every(v=>v.r>=0&&v.c>=0&&v.r<BR&&v.c<BC)),cond=constraintsOk();return{total,filled,non,conn,eq,over,inside,cond,done:total&&filled==total&&non&&conn&&eq&&over&&inside&&cond}}
function arrange(){let occ=new Set;st.p.forEach((p,i)=>{let a=trans(cells(i),p.rot,p.flip),pl=place(a,occ);p.x=pl.x;p.y=pl.y;occupy(a,p.x,p.y,occ)});render()}
function placeOne(i){let occ=new Set;st.p.forEach((p,j)=>{if(i!=j)occupy(trans(cells(j),p.rot,p.flip),p.x,p.y,occ)});let p=st.p[i],pl=place(trans(cells(i),p.rot,p.flip),occ);p.x=pl.x;p.y=pl.y}
function draw(r,c){let k=key(r,c),was=st.mode=="cut"&&st.sel>=0&&!cells(st.sel).length,changed=false;if(st.mode=="shape"){st.shape.has(k)?(st.shape.delete(k),st.asg.delete(k),changed=true):(st.shape.add(k),changed=true)}else if(st.shape.has(k)){st.sel<0?changed=st.asg.delete(k):st.asg.get(k)!==st.sel&&(st.asg.set(k,st.sel),changed=true)}if(changed)st.reveal=false;if(changed&&was&&cells(st.sel).length)placeOne(st.sel);render()}
function folderMatch(t,id){if(id==="all")return true;if(id==="two")return t.parts===2;if(id==="three")return t.parts===3;if(id==="conditions")return t.folder==="conditions"||(t.constraints||[]).length;return t.folder===id}
function filteredTasks(){let q=$("search").value.trim().toLowerCase(),pf=$("partsFilter").value;return data.tasks.filter(t=>folderMatch(t,activeFolder)&&(pf==="all"||String(t.parts)===pf)&&(!q||[t.title,t.prompt,...(t.tags||[])].join(" ").toLowerCase().includes(q)))}
function ruCount(n,one,few,many){let a=Math.abs(n)%100,b=a%10;return n+" "+(a>10&&a<20?many:b===1?one:b>1&&b<5?few:many)}
function taskMeta(t){if(t.externalOnly)return t.parts?`${ruCount(t.parts,"часть","части","частей")}, открыть источник`:"открыть источник";return `${ruCount(t.parts,"часть","части","частей")}, ${ruCount(t.cells.length,"клетка","клетки","клеток")}`}

function sourceLink(t,label="Источник"){return t.sourceUrl?`<a class=source-link href="${t.sourceUrl}" target="_blank" rel="noopener">${label}: ${t.source||"оригинал"}</a>`:""}
function externalPreview(){return `<svg class=preview viewBox="0 0 58 58" aria-hidden=true><rect x="10" y="8" width="34" height="42" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><path d="M35 8v11h9" fill="none" stroke="#0f766e" stroke-width="2"/><path d="M17 28h20M17 35h18" stroke="#64748b" stroke-width="2" stroke-linecap="round"/></svg>`}
function renderExternalNotice(){let n=$("externalNotice");if(!activeTask?.externalOnly){n.innerHTML="";return}n.innerHTML=`<b>Эта задача пока открывается в оригинальном листе.</b><p style="margin-top:8px">${activeTask.prompt}</p><div class="row external-actions"><a class=source-link href="${activeTask.sourceUrl}" target="_blank" rel="noopener">Открыть задание</a></div>`}
function setStage(){document.body.classList.toggle("choosing",choosing);document.body.classList.toggle("solving",!choosing);document.body.classList.toggle("external-task",!!activeTask?.externalOnly);document.body.classList.toggle("overlay-collapsed",!overlayOpen);$("confirmTask").disabled=!activeTask;$("toggleOverlay").textContent=overlayOpen?"Свернуть наложение":"Показать наложение";$("splitRange").value=split;$("splitLabel").textContent=split+"% разрез / "+(100-split)+"% наложение";$("workspace").style.setProperty("--cut",split+"%")}
function setSplit(v){split=Math.max(35,Math.min(70,v));setStage()}
function renderCatalog(){let folders=[{id:"all",title:"Все задачи"},...data.folders];$("total").textContent=data.tasks.length+" задач";$("folders").innerHTML="";folders.forEach(f=>{let count=data.tasks.filter(t=>folderMatch(t,f.id)).length,b=document.createElement("button");b.className="folder"+(activeFolder===f.id?" on":"");b.innerHTML=`<b>${f.title}</b><span class=muted>${count}</span>`;b.onclick=()=>{activeFolder=f.id;renderCatalog()};$("folders").appendChild(b)});let tasks=filteredTasks();$("shown").textContent=tasks.length+" показано";$("confirmTask").disabled=!activeTask;$("cards").innerHTML=tasks.length?"":'<div class="empty">Ничего не найдено</div>';tasks.forEach(t=>{let b=document.createElement("button");b.className="card"+(activeTask?.id===t.id?" on":"");b.innerHTML=previewSvg(t)+`<span><b>${t.title}</b><span class=muted style="display:block;margin-top:4px">${taskMeta(t)}</span>${t.source?`<span class="source-line">${t.source}</span>`:""}<span class=chips>${(t.tags||[]).map(x=>`<i class=chip>${x}</i>`).join("")}</span></span>`;b.onclick=()=>loadTask(t.id);$("cards").appendChild(b)})}

function loadTask(id){activeTask=data.tasks.find(t=>t.id===id);if(!activeTask)return;st={mode:"cut",shape:new Set,asg:new Map,p:[],sel:0,reveal:false,drag:null};markByDisplay=new Map();if(activeTask.externalOnly){renderCatalog();setStage();render();return}let mr=Math.max(...activeTask.cells.map(v=>v[0])),mc=Math.max(...activeTask.cells.map(v=>v[1]));offset={r:Math.max(0,Math.floor((R-mr-1)/2)),c:Math.max(0,Math.floor((C-mc-1)/2))};activeTask.cells.forEach(v=>st.shape.add(originalToDisplay(v)));ensure(activeTask.parts);(activeTask.starterAssignments||[]).forEach(g=>(g.cells||[]).forEach(v=>st.asg.set(originalToDisplay(v),g.part)));markByDisplay=new Map((activeTask.markers||[]).map(m=>[originalToDisplay(m.cell),m.id]));mode("cut");arrange();renderCatalog();setStage()}
function renderTaskInfo(){if(!activeTask)return;$("taskInfo").innerHTML=`<div class=task-title><h2>${activeTask.title}</h2><span class=chip>${taskChip(activeTask)}</span></div><p class=muted>${activeTask.prompt}</p>${sourceLink(activeTask)}<div class=chips>${(activeTask.tags||[]).map(x=>`<i class=chip>${x}</i>`).join("")}${(activeTask.constraints||[]).map(x=>`<i class=chip>${x.label}</i>`).join("")}</div>`}

let ps=$("pieces");ps.innerHTML="";[[-1,"Без части","#e2e8f0"],...st.p.map((p,i)=>[i,p.name,p.col])].forEach(([i,n,col])=>{let b=document.createElement("button");b.className="piece"+(st.sel==i?" on":"");b.innerHTML=`<i class=sw style="background:${col}"></i><b>${n}</b><span>${i<0?"-":cells(i).length}</span>`;b.onclick=()=>{st.sel=i;mode("cut");render()};ps.appendChild(b)});
$("chosen").textContent=st.p[st.sel]?.name||"Часть";let bd=$("board");bd.innerHTML="";st.p.forEach((p,i)=>bCells(i).forEach((v,n)=>{let d=document.createElement("div");d.className="pc"+(i==st.sel?" on":"");d.style.cssText+=`left:${v.c*100/BC}%;top:${v.r*100/BR}%;background:${p.col};z-index:${10+i}`;d.textContent=n?"" : i+1;d.onpointerdown=e=>{st.sel=i;st.drag={i,sx:e.clientX,sy:e.clientY,x:p.x,y:p.y};d.setPointerCapture(e.pointerId);render()};bd.appendChild(d)}));
let s=solve(),list=[["Клетки",s.total?s.filled+"/"+s.total:"0/0",s.total&&s.filled==s.total],["Связность",s.conn?"да":"нет",s.conn],["Равенство",st.reveal?(s.eq?"да":"нет"):"скрыто",st.reveal?s.eq:null],["Условия",s.cond?"да":"нет",s.cond],["Наложение",s.over&&s.inside?"да":"нет",s.over&&s.inside]];$("checks").innerHTML="";list.forEach((x,i)=>{let d=document.createElement("div");d.className="check "+(x[2]===true?"ok":x[2]===false?"bad":"");d.innerHTML=`<b>${x[0]}</b><span>${x[1]}</span>`;if(i==2&&!st.reveal){let b=document.createElement("button");b.textContent="Проверить";b.onclick=()=>{st.reveal=true;render()};d.appendChild(b)}$("checks").appendChild(d)});
let ready=s.total&&s.filled==s.total&&s.non&&s.conn&&s.cond&&s.over&&s.inside,txt=s.done&&st.reveal?"Решено":!st.reveal&&ready?"Можно проверить":st.reveal?"Пока не совпало":"Идет сборка";$("status").className="status "+(s.done&&st.reveal?"solved":"");$("status").querySelector("span").textContent=txt}
function mode(m){st.mode=m;$("mShape").classList.toggle("on",m==="shape");$("mCut").classList.toggle("on",m==="cut")}
$("search").oninput=renderCatalog;$("partsFilter").onchange=renderCatalog;$("confirmTask").onclick=()=>{choosing=false;overlayOpen=false;setStage();render();scrollTo({top:0,behavior:"smooth"})};$("changeTask").onclick=()=>{choosing=true;setStage();renderCatalog();scrollTo({top:0,behavior:"smooth"})};$("toggleOverlay").onclick=()=>{overlayOpen=!overlayOpen;setStage();render()};$("splitRange").oninput=e=>setSplit(+e.target.value);$("lessCut").onclick=()=>setSplit(split-5);$("moreCut").onclick=()=>setSplit(split+5);$("mShape").onclick=()=>{mode("shape");render()};$("mCut").onclick=()=>{mode("cut");render()};$("resetTask").onclick=()=>loadTask(activeTask.id);$("add").onclick=()=>{ensure(Math.min(24,st.p.length+1));st.sel=st.p.length-1;st.reveal=false;arrange()};$("rem").onclick=()=>{if(st.p.length>1){ensure(st.p.length-1);st.reveal=false;render()}};$("clear").onclick=()=>{st.asg.clear();st.reveal=false;arrange()};$("arrange").onclick=arrange;$("snap").onclick=()=>{let t=canon(cells(0));st.p.forEach((p,i)=>{for(let f of[0,1])for(let r=0;r<4;r++)if(sig(trans(cells(i),r,f))===t){p.rot=r;p.flip=!!f}p.x=7;p.y=5});render()};$("rot").onclick=()=>{let p=st.p[st.sel];if(p){p.rot=(p.rot+1)%4;render()}};$("flip").onclick=()=>{let p=st.p[st.sel];if(p){p.flip=!p.flip;render()}};[["left",-1,0],["right",1,0],["up",0,-1],["down",0,1]].forEach(v=>$(v[0]).onclick=()=>{let p=st.p[st.sel];if(p){p.x+=v[1];p.y+=v[2];render()}});
$("board").onpointermove=e=>{if(!st.drag)return;let r=$("board").getBoundingClientRect(),p=st.p[st.drag.i];p.x=st.drag.x+Math.round((e.clientX-st.drag.sx)/(r.width/BC));p.y=st.drag.y+Math.round((e.clientY-st.drag.sy)/(r.height/BR));render()};onpointerup=()=>st.drag=null;init();
