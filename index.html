<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Разрезания клетчатых фигур</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#172033;font-family:Arial,system-ui,sans-serif}main{width:min(1400px,calc(100% - 24px));margin:auto;padding:18px 0}h1{margin:0 0 14px;font-size:clamp(24px,3vw,38px)}.wrap{display:grid;grid-template-columns:430px 1fr;gap:14px}.panel{background:white;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 14px 34px #0f172a18;overflow:hidden}.head,.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #d8e0ea}.body{padding:10px}.modes{display:grid;grid-template-columns:1fr 1fr;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}.modes button{border:0;border-radius:0;background:#f1f5f9}.modes .on,.primary{background:#0f766e;color:white}button,select{font:inherit;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#172033;min-height:36px;padding:0 10px;cursor:pointer}button:hover{background:#f8fafc}.grid{display:grid;grid-template-columns:repeat(12,min(7vw,34px));grid-template-rows:repeat(10,min(7vw,34px));gap:3px;justify-content:center;padding:10px;border:1px solid #d8e0ea;border-radius:8px;background:#f8fafc}.cell{border:1px solid #cbd5e1;border-radius:4px;background:white}.cell.shape{background:#e0f2fe;border-color:#7dd3fc}.cell.sel{box-shadow:inset 0 0 0 3px #fff,0 0 0 1px #334155}.pieces{display:grid;gap:7px;margin-top:10px}.piece{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;text-align:left}.piece.on{outline:3px solid #0f766e30;border-color:#0f766e}.sw{width:22px;height:22px;border-radius:6px;border:1px solid #33415555}.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.check{min-height:62px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;padding:8px;display:grid;gap:4px;align-content:center}.ok{background:#ecfdf5;border-color:#6ee7b7}.bad{background:#fff7ed;border-color:#fdba74}.check b{font-size:13px}.check span,.muted{color:#64748b;font-size:13px}.board{position:relative;width:100%;aspect-ratio:18/14;min-height:360px;border:1px solid #94a3b8;border-radius:8px;background-color:white;background-image:linear-gradient(to right,#94a3b870 1px,transparent 1px),linear-gradient(to bottom,#94a3b870 1px,transparent 1px);background-size:calc(100%/18) calc(100%/14);touch-action:none;user-select:none;overflow:hidden}.pc{position:absolute;width:calc(100%/18);height:calc(100%/14);border:1px solid #17203399;border-radius:5px;box-shadow:inset 0 0 0 2px #ffffff66;display:grid;place-items:center;color:white;font-weight:700;text-shadow:0 1px 2px #0008;cursor:grab}.pc.on{outline:3px solid #0f766e80;outline-offset:-3px}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#f97316}.solved{background:#ecfdf5;color:#065f46}.solved .dot{background:#059669}.row{display:flex;gap:7px;flex-wrap:wrap}.move button{width:38px;padding:0}@media(max-width:950px){.wrap{grid-template-columns:1fr}.board{min-height:0}.checks{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){main{width:calc(100% - 14px)}.head,.bar{align-items:stretch;flex-direction:column}.row button,.row select{flex:1}.grid{grid-template-columns:repeat(12,min(7vw,28px));grid-template-rows:repeat(10,min(7vw,28px))}}
</style></head><body><main><h1>Разрезания клетчатых фигур</h1><div id="status" class="status"><i class="dot"></i><span>Идет сборка</span></div><section class="wrap" style="margin-top:12px"><div class="panel"><div class="head"><b>Фигура и разрез</b><div class="row"><select id="ex"><optgroup label="Демонстрации"><option value="l4">Квадрат 4x4: четыре L</option><option value="stairs">Лестница: три части</option></optgroup><optgroup label="Фигуры с листочка"><option value="p21">2 части - фигура 1</option><option value="p22">2 части - фигура 2</option><option value="p23">2 части - фигура 3</option><option value="p31">3 части - фигура 1</option><option value="p32">3 части - фигура 2</option><option value="p33">3 части - фигура 3</option><option value="p34">3 части - фигура 4</option></optgroup><optgroup label="Своя фигура"><option value="blank">Пустая сетка</option></optgroup></select><button id="load">Загрузить</button></div></div><div class="body"><div class="modes"><button id="mShape" class="on">Фигура</button><button id="mCut">Разрез</button></div><div id="grid" class="grid"></div><div id="pieces" class="pieces"></div><div class="row" style="margin-top:10px"><button id="add">Добавить часть</button><button id="rem">Убрать часть</button><button id="clear">Очистить</button></div><div id="checks" class="checks"></div></div></div><div class="panel"><div class="head"><b>Совмещение частей</b><div class="row"><button id="arrange">Разложить</button><button id="snap" class="primary">Наложить</button></div></div><div class="body"><div class="bar"><span id="chosen" class="muted"></span><div class="row move"><button id="left">←</button><button id="up">↑</button><button id="down">↓</button><button id="right">→</button><button id="rot">⟳</button><button id="flip">⇋</button></div></div><div id="board" class="board"></div></div></div></section></main><script>
const R=10,C=12,BR=14,BC=18,colors=["#2563eb","#f97316","#16a34a","#dc2626","#7c3aed","#0891b2","#ca8a04","#be185d"];
const figs={p21:{n:2,c:[[0,1],[0,2],[1,0],[1,1],[1,2],[2,1],[2,2],[3,1]]},p22:{n:2,c:[[0,2],[0,3],[0,4],[1,0],[1,1],[1,2],[1,3],[2,1]]},p23:{n:2,c:[[0,3],[1,1],[1,2],[1,3],[2,0],[2,1],[2,2],[2,3],[2,4],[3,0],[3,1],[3,2],[3,3],[4,1]]},p31:{n:3,c:[[0,4],[1,3],[1,4],[1,5],[2,1],[2,2],[2,3],[2,4],[3,0],[3,1],[3,2],[3,3]]},p32:{n:3,c:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[1,3],[2,1],[2,2],[2,3],[2,4],[3,2]]},p33:{n:3,c:[[0,1],[0,2],[0,3],[1,1],[1,2],[1,3],[1,4],[2,0],[2,1],[2,2],[2,3],[2,4],[2,5],[3,1],[3,2],[3,3],[4,2],[4,3]]},p34:{n:3,c:[[0,0],[0,4],[1,0],[1,1],[1,3],[1,4],[2,0],[2,1],[2,2],[2,3],[2,4],[3,0],[3,1],[3,2],[3,3],[3,4],[4,0],[4,1],[4,2],[4,3],[4,4],[5,0],[5,1],[5,2],[5,3],[5,4],[6,1],[6,2],[6,3],[7,2]]}};
let st={mode:"shape",shape:new Set,asg:new Map,p:[],sel:0,reveal:false,drag:null};
const $=id=>document.getElementById(id),key=(r,c)=>r+","+c,xy=k=>k.split(",").map(Number),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function ensure(n){while(st.p.length<n){let i=st.p.length;st.p.push({name:"Часть "+(i+1),col:colors[i%colors.length],x:1,y:1,rot:0,flip:false})}while(st.p.length>n){let i=st.p.length-1;st.p.pop();[...st.asg].forEach(([k,v])=>{if(v==i)st.asg.delete(k)})}st.sel=Math.min(st.sel,st.p.length-1)}
function cells(i){let a=[];for(let k of st.shape)if(st.asg.get(k)===i){let [r,c]=xy(k);a.push({r,c})}return a}
function norm(a){if(!a.length)return[];let mr=Math.min(...a.map(v=>v.r)),mc=Math.min(...a.map(v=>v.c));return a.map(v=>({r:v.r-mr,c:v.c-mc})).sort((a,b)=>a.r-b.r||a.c-b.c)}
function rot(v,n){let r=v.r,c=v.c;while(n--){[r,c]=[c,-r]}return{r,c}}
function trans(a,r,f){return norm(norm(a).map(v=>rot(f?{r:v.r,c:-v.c}:v,r)))}
function sig(a){return norm(a).map(v=>v.r+":"+v.c).join("|")}
function canon(a){let s=[];for(let f of[0,1])for(let r=0;r<4;r++)s.push(sig(trans(a,r,f)));return s.sort()[0]||""}
function dim(a){a=norm(a);return a.length?{h:Math.max(...a.map(v=>v.r))+1,w:Math.max(...a.map(v=>v.c))+1}:{h:0,w:0}}
function bCells(i){let p=st.p[i];return trans(cells(i),p.rot,p.flip).map(v=>({r:v.r+p.y,c:v.c+p.x}))}
function okPlace(a,x,y,occ){return a.every(v=>v.r+y>=0&&v.c+x>=0&&v.r+y<BR&&v.c+x<BC&&!occ.has((v.r+y)+":"+(v.c+x)))}
function occupy(a,x,y,occ){a.forEach(v=>occ.add((v.r+y)+":"+(v.c+x)))}
function place(a,occ){let d=dim(a),mx=Math.max(0,BC-d.w),my=Math.max(0,BR-d.h);for(let i=0;i<160;i++){let x=rnd(0,mx),y=rnd(0,my);if(okPlace(a,x,y,occ))return{x,y}}for(let y=0;y<=my;y++)for(let x=0;x<=mx;x++)if(okPlace(a,x,y,occ))return{x,y};return{x:rnd(0,mx),y:rnd(0,my)}}
function connected(a){if(!a.length)return false;let s=new Set(a.map(v=>key(v.r,v.c))),q=[a[0]],seen=new Set([key(a[0].r,a[0].c)]);for(let i=0;i<q.length;i++)for(let[dR,dC]of[[1,0],[-1,0],[0,1],[0,-1]]){let n=key(q[i].r+dR,q[i].c+dC);if(s.has(n)&&!seen.has(n)){seen.add(n);q.push({r:q[i].r+dR,c:q[i].c+dC})}}return seen.size==s.size}
function solve(){let total=st.shape.size,filled=[...st.shape].filter(k=>st.asg.has(k)).length,arr=st.p.map((_,i)=>cells(i)),non=arr.every(a=>a.length),conn=non&&arr.every(connected),can=arr.map(canon),eq=non&&can.every(x=>x==can[0]),bs=st.p.map((_,i)=>bCells(i).map(v=>v.r+":"+v.c).sort().join("|")),over=non&&bs.every(x=>x==bs[0]),inside=st.p.every((_,i)=>bCells(i).every(v=>v.r>=0&&v.c>=0&&v.r<BR&&v.c<BC));return{total,filled,non,conn,eq,over,inside,done:total&&filled==total&&non&&conn&&eq&&over&&inside}}
function arrange(){let occ=new Set;st.p.forEach((p,i)=>{let a=trans(cells(i),p.rot,p.flip),pl=place(a,occ);p.x=pl.x;p.y=pl.y;occupy(a,p.x,p.y,occ)});render()}
function placeOne(i){let occ=new Set;st.p.forEach((p,j)=>{if(i!=j)occupy(trans(cells(j),p.rot,p.flip),p.x,p.y,occ)});let p=st.p[i],pl=place(trans(cells(i),p.rot,p.flip),occ);p.x=pl.x;p.y=pl.y}
function draw(r,c){let k=key(r,c),was=st.mode=="cut"&&st.sel>=0&&!cells(st.sel).length,changed=false;if(st.mode=="shape"){st.shape.has(k)?(st.shape.delete(k),st.asg.delete(k),changed=true):(st.shape.add(k),changed=true)}else if(st.shape.has(k)){st.sel<0?changed=st.asg.delete(k):st.asg.get(k)!==st.sel&&(st.asg.set(k,st.sel),changed=true)}if(changed)st.reveal=false;if(changed&&was&&cells(st.sel).length)placeOne(st.sel);render()}
function render(){let g=$("grid");g.innerHTML="";for(let r=0;r<R;r++)for(let c=0;c<C;c++){let b=document.createElement("button"),k=key(r,c),i=st.asg.get(k);b.className="cell"+(st.shape.has(k)?" shape":"")+(i===st.sel&&st.mode=="cut"?" sel":"");if(i!==undefined)b.style.background=st.p[i].col;b.onclick=()=>draw(r,c);g.appendChild(b)}
let ps=$("pieces");ps.innerHTML="";[[-1,"Без части","#e2e8f0"],...st.p.map((p,i)=>[i,p.name,p.col])].forEach(([i,n,col])=>{let b=document.createElement("button");b.className="piece"+(st.sel==i?" on":"");b.innerHTML=`<i class=sw style="background:${col}"></i><b>${n}</b><span>${i<0?"-":cells(i).length}</span>`;b.onclick=()=>{st.sel=i;mode("cut");render()};ps.appendChild(b)});
$("chosen").textContent=st.p[st.sel]?.name||"Часть";let bd=$("board");bd.innerHTML="";st.p.forEach((p,i)=>bCells(i).forEach((v,n)=>{let d=document.createElement("div");d.className="pc"+(i==st.sel?" on":"");d.style.cssText+=`left:${v.c*100/BC}%;top:${v.r*100/BR}%;background:${p.col};z-index:${10+i}`;d.textContent=n?"" : i+1;d.onpointerdown=e=>{st.sel=i;st.drag={i,sx:e.clientX,sy:e.clientY,x:p.x,y:p.y};d.setPointerCapture(e.pointerId);render()};bd.appendChild(d)}));
let s=solve(),list=[["Клетки",s.total?s.filled+"/"+s.total:"0/0",s.total&&s.filled==s.total],["Связность",s.conn?"да":"нет",s.conn],["Равенство",st.reveal?(s.eq?"да":"нет"):"скрыто",st.reveal?s.eq:null],["Наложение",s.over&&s.inside?"да":"нет",s.over&&s.inside]];$("checks").innerHTML="";list.forEach((x,i)=>{let d=document.createElement("div");d.className="check "+(x[2]===true?"ok":x[2]===false?"bad":"");d.innerHTML=`<b>${x[0]}</b><span>${x[1]}</span>`;if(i==2&&!st.reveal){let b=document.createElement("button");b.textContent="Проверить";b.onclick=()=>{st.reveal=true;render()};d.appendChild(b)}$("checks").appendChild(d)});
let ready=s.total&&s.filled==s.total&&s.non&&s.conn&&s.over&&s.inside,txt=s.done&&st.reveal?"Решено":!st.reveal&&ready?"Можно проверить":st.reveal?"Пока не совпало":"Идет сборка";$("status").className="status "+(s.done&&st.reveal?"solved":"");$("status").querySelector("span").textContent=txt}
function mode(m){st.mode=m;$("mShape").classList.toggle("on",m=="shape");$("mCut").classList.toggle("on",m=="cut")}
function load(n){st.shape.clear();st.asg.clear();st.reveal=false;if(n=="blank"){ensure(3);arrange();return}if(figs[n]){ensure(figs[n].n);let a=figs[n].c,mr=Math.max(...a.map(v=>v[0])),mc=Math.max(...a.map(v=>v[1])),or=Math.max(0,Math.floor((R-mr-1)/2)),oc=Math.max(0,Math.floor((C-mc-1)/2));a.forEach(v=>st.shape.add(key(v[0]+or,v[1]+oc)));mode("cut");arrange();return}let groups=n=="l4"?[[[0,0],[1,0],[2,0],[2,1]],[[0,1],[0,2],[0,3],[1,1]],[[1,2],[1,3],[2,3],[3,3]],[[2,2],[3,0],[3,1],[3,2]]]:[[[2,4],[3,4],[4,4],[4,5]],[[3,5],[3,6],[4,6],[5,6]],[[4,7],[5,7],[5,8],[5,9]]];ensure(groups.length);groups.forEach((gr,i)=>gr.forEach(v=>{let k=key(v[0]+(n=="l4"?3:0),v[1]+(n=="l4"?4:0));st.shape.add(k);st.asg.set(k,i)}));mode("cut");arrange()}
$("mShape").onclick=()=>{mode("shape");render()};$("mCut").onclick=()=>{mode("cut");render()};$("load").onclick=()=>load($("ex").value);$("add").onclick=()=>{ensure(Math.min(8,st.p.length+1));st.sel=st.p.length-1;st.reveal=false;arrange()};$("rem").onclick=()=>{if(st.p.length>1){ensure(st.p.length-1);st.reveal=false;render()}};$("clear").onclick=()=>{st.asg.clear();st.reveal=false;arrange()};$("arrange").onclick=arrange;$("snap").onclick=()=>{let t=canon(cells(0));st.p.forEach((p,i)=>{for(let f of[0,1])for(let r=0;r<4;r++)if(sig(trans(cells(i),r,f))==t){p.rot=r;p.flip=!!f}p.x=7;p.y=5});render()};$("rot").onclick=()=>{let p=st.p[st.sel];if(p){p.rot=(p.rot+1)%4;render()}};$("flip").onclick=()=>{let p=st.p[st.sel];if(p){p.flip=!p.flip;render()}};[["left",-1,0],["right",1,0],["up",0,-1],["down",0,1]].forEach(v=>$(v[0]).onclick=()=>{let p=st.p[st.sel];if(p){p.x+=v[1];p.y+=v[2];render()}});
$("board").onpointermove=e=>{if(!st.drag)return;let r=$("board").getBoundingClientRect(),p=st.p[st.drag.i];p.x=st.drag.x+Math.round((e.clientX-st.drag.sx)/(r.width/BC));p.y=st.drag.y+Math.round((e.clientY-st.drag.sy)/(r.height/BR));render()};onpointerup=()=>st.drag=null;load("l4");
</script></body></html>
